[project]
name = "soc-log-analyser"
version = "1.0.0"
description = "Free, lightweight Tier 1 SOC log analyser — parses auth.log + OSSEC alerts, flags brute-force and integrity changes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
