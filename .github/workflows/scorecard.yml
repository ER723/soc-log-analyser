# This workflow uses actions that are not certified by GitHub. They are
# provided by a third-party (OpenSSF) and are governed by separate terms of
# service, privacy policy, and support documentation.
#
# OpenSSF Scorecard analyses the repo's security posture (branch protection,
# token permissions, pinned dependencies, SAST, maintenance activity, etc.)
# and publishes the result so the README badge and the scorecard.dev viewer
# can display it.

name: Scorecard analysis workflow

on:
  # For Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 6'  # Weekly, Saturdays 01:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to the code-scanning dashboard
      id-token: write         # OIDC token, required to publish results + badge

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Scorecard team runs a weekly scan of public GitHub repos, see
          # https://github.com/ossf/scorecard#public-data. Setting
          # publish_results: true publishes this repo's own scan result to
          # the public dataset and powers the README badge below.
          publish_results: true

      # Upload the SARIF as a build artifact for inspection.
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload results to GitHub's code scanning dashboard (Security tab).
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
