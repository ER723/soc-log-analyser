name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release and upload assets
      id-token: write       # OIDC token for build provenance attestation
      attestations: write   # publish the attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run tests before releasing anything
        run: python3 -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-dev.txt
          uv build

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attach attestation bundle as a release asset
        # actions/attest-build-provenance publishes to GitHub's Attestations
        # API, which OpenSSF Scorecard's Signed-Releases check does not
        # currently look at (it only scans release ASSET filenames for
        # patterns like *.sig, *.sigstore.json, *.intoto.jsonl — see
        # https://github.com/ossf/scorecard/issues/4667). This copies the
        # same real attestation bundle produced above into dist/ with a
        # recognized filename so it's also attached as a downloadable
        # release asset, verifiable the normal way:
        #   gh attestation verify dist/<artifact> --owner ER723
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/soc-log-analyser-${{ github.ref_name }}.sigstore.json"

      - name: Create GitHub Release with signed artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
